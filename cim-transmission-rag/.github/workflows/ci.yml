name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check src/ tests/ notebooks/

      - name: Run CIM parser unit tests
        run: pytest tests/ -v --cov=src --cov-report=term-missing

      - name: Validate sample CIM XML
        run: python -c "
from src.parser.cim_parser import CIMParser
chunks = list(CIMParser('data/raw/sample_transmission.xml').parse())
assert len(chunks) > 0, 'Parser returned no chunks'
print(f'Parser OK: {len(chunks)} CIM objects parsed')
"
